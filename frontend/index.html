<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>TaskManage - RotiCanai</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&family=Caveat:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/lecturer.css" />
    <link rel="stylesheet" href="css/team.css" />
    <link rel="stylesheet" href="css/teams.css" />
    <link rel="stylesheet" href="css/team-overview.css" />
    <link rel="stylesheet" href="css/team-manage.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/member.css" />
    <link rel="stylesheet" href="css/lecturer-details.css" />
    <link rel="stylesheet" href="css/preview-notice.css" />
  </head>
  <body>
    <div class="sh">
      <aside class="sb">
        <div class="lg">
          <svg class="i" viewBox="0 0 24 24" style="width: 28px; height: 28px">
            <path
              d="M5 20C4 11 10 4 20 4c0 9-5 15-13 15M5 20c3-5 6-8 10-11"
            /></svg
          ><span>CPS1043</span>
        </div>
        <nav id="nv" aria-label="Navigasi utama"></nav>
        <div class="sidebar-account">
          <span class="av">N</span>
          <div><b>Nizam</b><small>Student Account</small></div>
        </div>
      </aside>
      <main class="mn" id="mn"></main>
    </div>
    <dialog id="dg"><form method="dialog" id="df"></form></dialog>
    <dialog
      id="preview-notice"
      class="preview-notice"
      aria-labelledby="preview-notice-title"
      aria-describedby="preview-notice-description"
    >
      <button
        class="preview-notice-close"
        id="preview-notice-close"
        type="button"
        aria-label="Close notice"
      >
        ×
      </button>
      <div class="preview-notice-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="8" y="10" width="32" height="23" rx="2" />
          <path d="M18 39h12M24 33v6M3 8 1 6M45 8l2-2M2 20H0M48 20h-2" />
        </svg>
      </div>
      <h2 id="preview-notice-title">Frontend Preview Only</h2>
      <p id="preview-notice-description">
        This system is currently a frontend-only preview. Team tasks are saved
        in this browser only and are not shared with other members because the
        backend is not connected yet.
      </p>
      <div class="preview-notice-info">
        <span aria-hidden="true">i</span>
        <b>Task data stays on this browser.</b>
      </div>
      <div class="preview-notice-actions">
        <label class="preview-notice-choice">
          <input id="preview-notice-no-show" type="checkbox" />
          <span>Don’t show again</span>
        </label>
        <button id="preview-notice-confirm" class="preview-notice-confirm" type="button" autofocus>
          Got it
        </button>
      </div>
    </dialog>

    <script src="js/app.js" defer></script>
  </body>
</html>
